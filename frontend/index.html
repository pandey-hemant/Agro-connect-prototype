<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Brand favicon: an inline SVG of a seedling in the primary green
         on the warm ivory ground. Keeping it inline means no extra
         request, no broken favicon in dev, and consistent rendering
         across browsers. (For production we also expose /favicon.svg
         via a small file with the same content so crawlers and
         social-share pickers can find it.) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6230" />
    <meta name="color-scheme" content="light" />

    <!-- SEO: a clear title and description so the SIH demo doesn't
         surface as an unnamed Vite app in any tab. -->
    <title>AgroConnect — Decide, Sell, and Earn More for Your Harvest</title>
    <meta
      name="description"
      content="AgroConnect helps farmers choose where to sell, see live mandi prices, compare offers, and connect directly with buyers. Built for Indian agriculture."
    />
    <meta name="author" content="AgroConnect" />
    <meta name="keywords" content="agriculture, farmers, mandi, market prices, offers, FPO, India" />

    <!-- Social share: a clean card for when judges or collaborators
         share the app link. We don't ship a real image; the meta
         alone is enough to make the link readable. -->
    <meta property="og:title" content="AgroConnect — Decide, Sell, and Earn More" />
    <meta property="og:description" content="Where to sell, what you'll actually earn, and who's offering — all in one place for the Indian farmer." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AgroConnect — Decide, Sell, and Earn More" />
    <meta name="twitter:description" content="Where to sell, what you'll actually earn, and who's offering — all in one place for the Indian farmer." />
  </head>
  <body class="bg-earth-50 text-ink-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
